<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY Teacher Hub · 통합 교사 현황</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../app/emblem.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="hub.css?v=3">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="../app/emblem.png" alt="" width="40" height="36">
    <div>
      <h1>MY Teacher Hub</h1>
      <p>통합 교사 현황 · 서울문영여자중학교</p>
    </div>
  </div>
  <div class="top-actions">
    <button id="btnConnect" class="btn ghost">🔌 연결</button>
    <button id="btnReload" class="btn ghost">🔄 새로고침</button>
    <button id="btnCsv" class="btn gold">⬇️ CSV</button>
  </div>
</header>

<details class="card launcher" id="launcher" open>
  <summary>🔗 앱 바로가기 <span class="small muted">(새 탭으로 열려요)</span></summary>
  <div class="links">
    <div class="lk"><a href="../app/" target="_blank" rel="noopener">📖 독서 여권</a><span class="small muted">교사 화면은 앱 안 [교사]</span></div>
    <div class="lk"><a href="../grammar/" target="_blank" rel="noopener">✏️ 문법</a><a class="sub" href="../grammar/admin.html" target="_blank" rel="noopener">교사</a></div>
    <div class="lk"><a href="../quiz/" target="_blank" rel="noopener">👑 Quiz Queens</a></div>
    <div class="lk"><a href="../brainup/" target="_blank" rel="noopener">🧠 MY Brain Up</a><a class="sub" href="../brainup/#/teacher" target="_blank" rel="noopener">교사</a></div>
    <div class="lk"><a href="../danuhsup/" target="_blank" rel="noopener">🌳 단어숲</a></div>
    <div class="lk"><a href="../cloze/" target="_blank" rel="noopener">🧩 Cloze</a></div>
    <div class="lk"><a href="../writing1/" target="_blank" rel="noopener">✍️ 영작문</a></div>
    <div class="lk"><a href="../speaking/" target="_blank" rel="noopener">🎤 말하기</a><a class="sub" href="../speaking/#/teacher" target="_blank" rel="noopener">교사</a></div>
    <div class="lk"><a href="../level/" target="_blank" rel="noopener">🧭 레벨 테스트</a><a class="sub" href="../level/#/teacher" target="_blank" rel="noopener">교사</a></div>
    <div class="lk"><a href="../kahoot/" target="_blank" rel="noopener">⚡ Kahoot (교사)</a><a class="sub" href="../kahoot/student.html" target="_blank" rel="noopener">학생</a></div>
    <div class="lk"><a href="../class123/" target="_blank" rel="noopener">⭐ Class123</a></div>
    <div class="lk"><a href="../quizshow/" target="_blank" rel="noopener">🎬 퀴즈쇼</a></div>
    <div class="lk"><a href="../me/" target="_blank" rel="noopener">🧭 학생 페이지</a><span class="small muted">MY English Journey</span></div>
    <div class="lk"><a href="../" target="_blank" rel="noopener">🏠 첫 화면</a></div>
  </div>
</details>

<section id="conn" class="conn"></section>

<section class="filters card">
  <label>학년 <select id="fGrade"></select></label>
  <label>반 <select id="fClass"></select></label>
  <label>기간
    <select id="fPeriod">
      <option value="today">오늘</option>
      <option value="week" selected>이번 주</option>
      <option value="7d">최근 7일</option>
      <option value="month">이번 달</option>
      <option value="30d">최근 30일</option>
      <option value="all">전체</option>
      <option value="custom">직접 선택</option>
    </select>
  </label>
  <span id="customRange" class="hidden">
    <input type="date" id="fFrom"> ~ <input type="date" id="fTo">
  </span>
  <label class="grow">검색 <input id="fQ" type="search" placeholder="이름 · 이메일"></label>
  <details class="appsel">
    <summary>표시할 앱</summary>
    <div id="appToggles"></div>
  </details>
</section>

<section id="kpis" class="kpis"></section>

<nav class="tabs" id="tabs">
  <button data-tab="class" class="on">📊 반별 요약</button>
  <button data-tab="students">👤 학생별</button>
  <button data-tab="idle">😴 관심 필요</button>
  <button data-tab="feed">🕒 최근 활동</button>
  <button data-tab="reward">🎁 보상</button>
</nav>

<main id="view"></main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button class="modal-x" id="modalX" aria-label="닫기">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script type="module" src="hub.js?v=14"></script>
</body>
</html>
