# Supabase 무료 프로젝트는 7일 동안 아무도 쓰지 않으면 일시 정지돼요.
# 방학에도 멈추지 않도록 매일 한 번 아주 가벼운 요청(bu_ping)을 보내요. 비용은 들지 않아요.
# GitHub → Actions → "Supabase keep-alive" → "Run workflow" 로 바로 시험해 볼 수도 있어요.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국 시간 오전 6시 17분
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://jkxdhyvnrvsiokbbbjtu.supabase.co/rest/v1/rpc/bu_ping" \
            -H "apikey: sb_publishable_XVHSc-RymsF_LYq4crnwag_heNOynBF" \
            -H "Content-Type: application/json" \
            -d '{}'
